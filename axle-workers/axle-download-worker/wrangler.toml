name = "axle-download"
main = "src/index.js"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# RELEASE_LATEST_API_URL is authoritative: it resolves whatever GitHub marks as
# the latest release, so publishing a new tag needs no worker change. The pinned
# RELEASE_* block below is only the offline fallback used when the GitHub API is
# unreachable, so it has to mirror the same repository and a real published tag,
# with sizes copied from that tag's released assets. GitHub's release API is
# authoritative when available; the fallback intentionally omits digests when
# the release metadata does not publish SHA-256 values.
[vars]
RELEASE_LATEST_API_URL = "https://api.github.com/repos/thatcreativetayo/AxleCode/releases/latest"
RELEASE_PUBLIC_BASE_URL = "https://github.com/thatcreativetayo/AxleCode/releases/download/v1.1.50"
RELEASE_VERSION = "1.1.50"
RELEASE_PUBLISHED_AT = "2026-11-15T08:27:48Z"
RELEASE_WINDOWS_SIZE = "354067021"
RELEASE_WINDOWS_SHA256 = ""
RELEASE_WINDOWS_BLOCKMAP_SIZE = "351336"
RELEASE_WINDOWS_BLOCKMAP_SHA256 = ""
RELEASE_WINDOWS_YML_SIZE = "322"
RELEASE_WINDOWS_YML_SHA256 = ""
RELEASE_LINUX_SIZE = "311130355"
RELEASE_LINUX_SHA256 = ""
RELEASE_LINUX_ASC_SIZE = "833"
RELEASE_LINUX_ASC_SHA256 = ""
RELEASE_LINUX_DEB_SIZE = "279606092"
RELEASE_LINUX_DEB_SHA256 = ""
RELEASE_LINUX_YML_SIZE = "357"
RELEASE_LINUX_YML_SHA256 = ""
RELEASE_MAC_ARM64_ZIP_SIZE = "366271046"
RELEASE_MAC_ARM64_ZIP_SHA256 = ""
RELEASE_MAC_ARM64_SIZE = "376637028"
RELEASE_MAC_ARM64_SHA256 = ""
RELEASE_MAC_ARM64_BLOCKMAP_SIZE = "394772"
RELEASE_MAC_ARM64_BLOCKMAP_SHA256 = ""
RELEASE_MAC_ARM64_YML_NAME = "latest-mac-arm64.yml"
RELEASE_MAC_ARM64_YML_SIZE = "471"
RELEASE_MAC_ARM64_YML_SHA256 = ""
RELEASE_MAC_X64_ZIP_SIZE = "372972953"
RELEASE_MAC_X64_ZIP_SHA256 = ""
RELEASE_MAC_X64_SIZE = "383457549"
RELEASE_MAC_X64_SHA256 = ""
